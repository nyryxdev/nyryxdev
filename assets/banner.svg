  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#17171c" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <style>
    .bg { fill: #0b0b0e; }
    .grid { fill: url(#grid); animation: drift 8s linear infinite; }
    .ttl { fill: #f4f4f5; opacity: 0; animation: rise 0.9s cubic-bezier(.2,.8,.2,1) forwards; }
    .sub { fill: #8b8b96; opacity: 0; animation: fade 0.5s ease forwards; }
    .rule { fill: #e8895c; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: rule 0.9s cubic-bezier(.2,.8,.2,1) 0.85s forwards; }
    .cursor { fill: #e8895c; animation: blink 1.05s steps(1) infinite; }
    .edge { fill: none; stroke: #2a2a33; stroke-width: 1.5; }
    .draw { fill: none; stroke: #e8895c; stroke-width: 1.5; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 2.4s ease-in-out 1.2s forwards; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px,40px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes rule { to { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ttl, .sub { opacity: 1; animation: none; }
      .rule { transform: scaleX(1); animation: none; }
      .draw { stroke-dashoffset: 0; animation: none; }
      .grid, .cursor { animation: none; }
    }
  </style>

